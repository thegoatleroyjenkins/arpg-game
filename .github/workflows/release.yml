name: Build + Release ARPG

on:
  push:
    branches: [ master, main ]
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag override (example: v0.0.02)"
        required: false
        type: string
      name:
        description: "Optional release title override"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: arpg-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Godot binary
        id: godot
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$(command -v godot || command -v godot4 || true)"
          if [ -z "$GODOT_BIN" ]; then
            echo "No godot binary found on PATH"
            exit 1
          fi
          echo "bin=$GODOT_BIN" >> "$GITHUB_OUTPUT"
          "$GODOT_BIN" --version

      - name: Validate export presets
        shell: bash
        run: |
          set -euo pipefail
          test -f export_presets.cfg
          grep -q 'name="Windows Desktop"' export_presets.cfg
          grep -q 'name="Linux"' export_presets.cfg
          echo "Export presets look good."

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.6"
          TEMPLATE_VERSION="4.6.stable"
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          mkdir -p "$TEMPLATES_DIR"

          TEMPLATE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          if command -v curl >/dev/null 2>&1; then
            curl -fsSL -o /tmp/godot_templates.tpz "$TEMPLATE_URL"
          elif command -v wget >/dev/null 2>&1; then
            wget -q -O /tmp/godot_templates.tpz "$TEMPLATE_URL"
          elif command -v python3 >/dev/null 2>&1; then
            python3 - <<PY
import urllib.request
urllib.request.urlretrieve("$TEMPLATE_URL", "/tmp/godot_templates.tpz")
PY
          else
            echo "No downloader available (curl/wget/python3 missing)."
            exit 1
          fi

          unzip -o -q /tmp/godot_templates.tpz -d "$TEMPLATES_DIR"

          # Godot may look either in .../<version>/templates/* or directly in .../<version>/*
          if [ -d "$TEMPLATES_DIR/templates" ]; then
            cp -f "$TEMPLATES_DIR"/templates/* "$TEMPLATES_DIR"/
          fi

          ls -1 "$TEMPLATES_DIR" | grep -E 'windows_(debug|release)_x86_64\.exe' > /dev/null
          echo "Export templates installed at $TEMPLATES_DIR"

      - name: Engine smoke test
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.godot.outputs.bin }}" --headless --path . --quit-after 1

      - name: Resolve release tag + title
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${{ github.event.inputs.tag || '' }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            git fetch --tags --force
            LATEST_TAG="$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)"

            if [[ -z "$LATEST_TAG" ]]; then
              NEXT=2
              TAG=$(printf 'v0.0.%02d' "$NEXT")
            elif [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              LAST="${BASH_REMATCH[4]}"
              NEXT=$((LAST + 1))
              TAG=$(printf 'v%d.%d.%02d' "$MAJOR" "$MINOR" "$NEXT")
            elif [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              NEXT=$((10#$PATCH + 1))
              TAG=$(printf 'v%d.%d.%02d' "$MAJOR" "$MINOR" "$NEXT")
            else
              echo "Unsupported tag format: $LATEST_TAG"
              exit 1
            fi
          fi

          if [ -n "${{ github.event.inputs.name || '' }}" ]; then
            NAME="${{ github.event.inputs.name }}"
          else
            NAME="ARPG ${TAG}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved release: $TAG ($NAME)"

      - name: Build Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows
          "${{ steps.godot.outputs.bin }}" --headless --path . --export-release "Windows Desktop" build/windows/ARPG.exe
          cd build/windows && zip -r ../arpg-windows.zip .

      - name: Build Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux
          "${{ steps.godot.outputs.bin }}" --headless --path . --export-release "Linux" build/linux/ARPG.x86_64
          cd build/linux && zip -r ../arpg-linux.zip .

      - name: Upload build artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arpg-build-bundles
          path: |
            build/arpg-windows.zip
            build/arpg-linux.zip
          if-no-files-found: warn

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          generate_release_notes: true
          files: |
            build/arpg-windows.zip
            build/arpg-linux.zip
