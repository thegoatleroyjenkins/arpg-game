name: Build ARPG Game

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.2.1
          use-dotnet: false

      - name: Build Windows
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/ARPG.exe
          cd build/windows && zip -r ../arpg-windows.zip .

      - name: Build Linux
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux" build/linux/ARPG.x86_64
          cd build/linux && zip -r ../arpg-linux.zip .

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arpg-windows
          path: build/arpg-windows.zip

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arpg-linux
          path: build/arpg-linux.zip
